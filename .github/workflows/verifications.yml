# Vérifications de chaque PR : le code se compile et les tests passent.
# Ce dépôt est public : il ne peut pas appeler les workflows internes de
# Zone01Rouen/.github, d'où ce fichier complet.
name: Vérifications PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Compilation et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer
        run: pip install -r requirements.txt pytest
      - name: Compiler
        run: python -m compileall -q bot.py cogs utils
      - name: Tests
        run: python -m pytest -q tests
